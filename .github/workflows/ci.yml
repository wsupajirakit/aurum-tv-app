name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: HMAC signer matches the backend test vector
        run: npm run verify:signer
      - name: tests (player, sources, splash — no TV needed)
        run: npm test
